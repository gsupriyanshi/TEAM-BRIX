<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report a Waste Problem</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="card" aria-labelledby="page-title">

            <!-- Header -->
            <header class="card-header">
                <div class="brand">
                    <img src="logo.jpeg" alt="Ripple: Small actions. Big impact." width="640" height="475">
                </div>
                <div class="header-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8" />
                    </svg>
                </div>
                <h1 id="page-title">Report a Waste Problem</h1>
                <p class="subtitle">Help us keep our communities cleaner, healthier, and greener.</p>
            </header>

            <!-- Form -->
            <form id="report-form" class="card-body" novalidate>

                <!-- 1. Category -->
                <fieldset class="section" id="category-group" aria-describedby="category-error">
                    <legend class="section-title">What is the problem?</legend>
                    <div class="category-grid">
                        <label class="category">
                            <input type="radio" name="category" value="Garbage">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" />
                                </svg>
                                <span>Garbage</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="Open Dump">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <path d="M3 19h18M5 19l4-8 3 4 3-6 4 10" />
                                </svg>
                                <span>Open Dump</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="Overflowing Dustbin">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <path d="M6 10h12l-1 10H7zM5 10h14M9 7L8 4M12 7V3M15 7l1-3" />
                                </svg>
                                <span>Overflowing Dustbin</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="Plastic Waste">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <path d="M10 3h4v3l2 3v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3zM8 13h8" />
                                </svg>
                                <span>Plastic Waste</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="Illegal Waste Disposal">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <path d="M12 3l10 18H2zM12 10v5M12 18v.01" />
                                </svg>
                                <span>Illegal Waste Disposal</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="E-Waste">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="12" rx="2" />
                                    <path d="M8 20h8M12 16v4" />
                                </svg>
                                <span>E-Waste</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="Construction Waste">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 6v4" />
                                </svg>
                                <span>Construction Waste</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="Sewage / Dirty Water">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z" />
                                </svg>
                                <span>Sewage / Dirty Water</span>
                            </span>
                        </label>
                        <label class="category">
                            <input type="radio" name="category" value="Other">
                            <span class="category-tile">
                                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                    <circle cx="6" cy="12" r="1.2" />
                                    <circle cx="12" cy="12" r="1.2" />
                                    <circle cx="18" cy="12" r="1.2" />
                                </svg>
                                <span>Other</span>
                            </span>
                        </label>
                    </div>
                    <p class="error" id="category-error" role="alert" hidden></p>
                </fieldset>

                <!-- 2. Location -->
                <div class="section">
                    <label class="section-title" for="location">Where is it located?</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" class="icon input-icon" aria-hidden="true">
                            <path
                                d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12zM12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" />
                        </svg>
                        <input type="text" id="location" name="location" placeholder="Enter the location of the issue"
                            autocomplete="street-address" aria-describedby="location-error" required>
                    </div>
                    <p class="error" id="location-error" role="alert" hidden></p>
                </div>

                <!-- 3. Description -->
                <div class="section">
                    <label class="section-title" for="description">Tell us more</label>
                    <textarea id="description" name="description" rows="5"
                        placeholder="Describe the problem in detail..."
                        aria-describedby="description-hint description-error" required></textarea>
                    <p class="hint" id="description-hint">Tell us what you observed and how it is affecting the area.
                    </p>
                    <p class="error" id="description-error" role="alert" hidden></p>
                </div>

                <!-- Live photo -->
                <div class="section" id="photo-section">
                    <span class="section-title" id="photo-title">Add a live photo <span
                            class="optional">(optional)</span></span>
                    <div class="photo-box" role="group" aria-labelledby="photo-title">
                        <video id="camera" autoplay playsinline muted hidden></video>
                        <img id="photo-preview" alt="Preview of the photo you added" hidden>
                        <div class="photo-empty" id="photo-empty">
                            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="16" rx="2" />
                                <path d="M3 16l5-5 4 4 3-3 6 6M9 9h.01" />
                            </svg>
                            <span>No photo added yet</span>
                        </div>
                    </div>
                    <div class="photo-actions">
                        <button type="button" class="ghost-btn" id="camera-btn">
                            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                <path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
                            </svg>
                            <span>Take Live Photo</span>
                        </button>
                        <button type="button" class="ghost-btn" id="snap-btn" hidden>
                            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                <circle cx="12" cy="12" r="8" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <span>Capture</span>
                        </button>
                        <button type="button" class="ghost-btn" id="upload-btn">
                            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                <path d="M12 16V4M7 9l5-5 5 5M4 20h16" />
                            </svg>
                            <span>Upload Photo</span>
                        </button>
                        <button type="button" class="ghost-btn" id="remove-btn" hidden>
                            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                                <path d="M5 5l14 14M19 5L5 19" />
                            </svg>
                            <span>Remove Photo</span>
                        </button>
                    </div>
                    <input type="file" id="photo-file" accept="image/*" hidden>
                    <input type="file" id="photo-capture" accept="image/*" capture="environment" hidden>
                    <p class="error" id="photo-error" role="alert" hidden></p>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="submit-btn">
                    <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                        <path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8" />
                    </svg>
                    <span class="btn-label">Submit Report</span>
                </button>
            </form>

            <footer class="card-footer">
                <span class="status-chip">Together for a Cleaner Tomorrow 🌱</span>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My impact | rippple</title>

  <!-- Fonts (loaded from Google Fonts, needs internet) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ---------- COLOURS (same list as index.html) ---------- */
    :root {
      --green: #157347;       /* main green */
      --green-deep: #0E5132;  /* darker green */
      --green-light: #58B587; /* lighter green */
      --green-soft: #E8F5EE;  /* very pale green: page background */
      --white: #FFFFFF;
      --ink: #12251B;         /* main text (a very dark green) */
      --muted: #4B5F54;       /* quieter text */
      --line: #C9E0D3;        /* borders */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--green-soft);
      color: var(--ink);
      font-family: "Mukta", system-ui, sans-serif;
      font-size: 1.125rem;
      line-height: 1.5;
    }

    /* Keeps the content from stretching too far on very big screens.
       CHANGE THIS: a bigger max-width makes the page wider. */
    .wrap {
      max-width: 80rem;
      margin: 0 auto;
      padding-left: clamp(1.25rem, 4vw, 3rem);
      padding-right: clamp(1.25rem, 4vw, 3rem);
    }

    /* ---------- GREEN BAR AT THE TOP ---------- */
    .topbar {
      padding: 1.25rem 0 1.5rem;
      background: var(--green);
      color: var(--white);
    }

    /* Title on the left, logo on the right */
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    /* LOGO: the picture file logo.jpg must be in the same folder as this page.
       CHANGE THIS: the numbers in "width" make the logo bigger or smaller. */
    .logo {
      display: block;
      width: clamp(6.5rem, 12vw, 9.5rem);
      height: auto;
      border-radius: 12px;
    }

    .back {
      color: var(--white);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .back:hover { color: var(--green-soft); }

    h1 {
      margin: 0.5rem 0 0;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 4vw, 3.4rem);
      line-height: 1.1;
    }

    h2 {
      margin: 0 0 0.9rem;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      line-height: 1.2;
    }

    /* ---------- THE BOXES ----------
       On a phone they stack one under another.
       On a laptop the streak and points sit side by side
       (see the "WIDE SCREENS" block further down). */
    .page {
      padding-top: 1.5rem;
      padding-bottom: 3rem;
    }

    .grid {
      display: grid;
      gap: 1.25rem;
    }

    .streak,
    .reports {
      padding: 1.25rem;
      background: var(--white);
      border: 2px solid var(--line);
      border-radius: 16px;
    }

    /* ---------- CLEAN STREAK ---------- */
    .streak-top {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
    }

    .streak-number {
      color: var(--green);
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(4.5rem, 7vw, 6rem);
      line-height: 0.85;
    }

    .streak-label {
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 600;
      font-size: 1.3rem;
      line-height: 1.15;
    }

    .streak-note {
      margin: 0.9rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    /* The week drawn as a row of blocks: one block per day.
       A filled block means you were active that day. */
    .kerb {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin: 1.25rem 0 0;
      padding: 0;
      list-style: none;
    }

    .stone {
      height: 30px;
      background: var(--white);
      border: 2px dashed #9CC4AE;
      border-radius: 4px;
    }

    .stone.painted { border: 0; }
    .kerb li:nth-child(odd) .stone.painted { background: var(--green); }
    .kerb li:nth-child(even) .stone.painted { background: var(--green-deep); }

    .day {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    /* ---------- IMPACT POINTS ---------- */
    .points {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 1.1rem 1.25rem 0.9rem;
      background: var(--green);
      color: var(--white);
      border-radius: 16px;
    }

    .points-number {
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 800;
      font-size: 3rem;
      line-height: 1;
    }

    .points-label {
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 600;
      font-size: 1.3rem;
    }

    /* ---------- MY REPORTS ---------- */
    .bars {
      display: grid;
      gap: 0.7rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 6.25rem 1fr 2rem;
      align-items: center;
      gap: 0.75rem;
    }

    .bar-track {
      height: 14px;
      background: var(--green-soft);
      border-radius: 7px;
      overflow: hidden;
    }

    .bar {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 7px;
      transition: width 0.8s ease;
    }

    .bar.submitted { background: var(--green-deep); }
    .bar.verified  { background: var(--green); }
    .bar.resolved  { background: var(--green-light); }

    .bar-value {
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1;
      text-align: right;
    }

    .reports-note {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ---------- BUTTON AT THE BOTTOM ---------- */
    .button {
      display: block;
      margin-top: 1.5rem;
      padding: 0.9rem 1.15rem 0.75rem;
      background: var(--green);
      color: var(--white);
      border-radius: 14px;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      text-align: center;
      text-decoration: none;
    }

    .button:hover { background: var(--green-deep); }

    /* Rings shown when someone moves through the page with the keyboard */
    .back:focus-visible,
    .logo-link:focus-visible {
      outline: 3px solid var(--white);
      outline-offset: 3px;
    }

    .button:focus-visible {
      outline: 3px solid var(--green-deep);
      outline-offset: 3px;
    }

    /* ---------- WIDE SCREENS (laptops and desktops) ----------
       Everything inside this block only applies when the window
       is wider than about 900 pixels. */
    @media (min-width: 56rem) {
      .topbar { padding: 1.75rem 0 2rem; }
      .page { padding-top: 2rem; }

      .grid {
        grid-template-columns: 1.6fr 1fr;   /* streak wider than points */
        gap: 1.5rem;
      }

      .streak,
      .reports { padding: 1.75rem 2rem; }

      /* My reports stretches across both columns */
      .reports { grid-column: 1 / -1; }

      .stone { height: 44px; }

      /* Points become a tall block with the number on top */
      .points {
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 0.25rem;
        padding: 1.75rem 2rem;
      }

      .points-number { font-size: clamp(4.5rem, 7vw, 6rem); }
      .points-label { font-size: 1.6rem; }

      .bar-row {
        grid-template-columns: 7rem 1fr 2.5rem;
        gap: 1rem;
      }

      .bar-track { height: 18px; border-radius: 9px; }
      .bar { border-radius: 9px; }

      /* The button is only as wide as its text */
      .button {
        display: inline-block;
        padding-left: 2.5rem;
        padding-right: 2.5rem;
      }
    }

    /* People who have turned off animations get the bars with no movement */
    @media (prefers-reduced-motion: reduce) {
      .bar { transition: none; }
    }
  </style>
</head>

<body>

  <!-- GREEN BAR AT THE TOP -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div>
        <a class="back" href="index.html">Back to home</a>
        <h1>My impact</h1>
      </div>

      <!-- LOGO: clicking it also goes back to the home page -->
      <a class="logo-link" href="index.html">
        <img class="logo" src="logo.jpg" alt="rippple logo, back to home" width="900" height="673">
      </a>
    </div>
  </header>

  <main class="wrap page">
    <div class="grid">

      <!-- CLEAN STREAK -->
      <section class="streak">
        <div class="streak-top">
          <span class="streak-number" id="streak-number">0</span>
          <span class="streak-label" id="streak-label">day<br>clean streak</span>
        </div>
        <ul class="kerb" id="kerb"></ul>
        <p class="streak-note" id="streak-note"></p>
      </section>

      <!-- IMPACT POINTS -->
      <section class="points">
        <span class="points-number" id="points-number">0</span>
        <span class="points-label">impact points</span>
      </section>

      <!-- REPORTS SUBMITTED, VERIFIED, RESOLVED -->
      <section class="reports">
        <h2>My reports</h2>
        <ul class="bars">
          <li class="bar-row">
            <span>Submitted</span>
            <span class="bar-track"><span class="bar submitted" id="bar-submitted"></span></span>
            <span class="bar-value" id="num-submitted">0</span>
          </li>
          <li class="bar-row">
            <span>Verified</span>
            <span class="bar-track"><span class="bar verified" id="bar-verified"></span></span>
            <span class="bar-value" id="num-verified">0</span>
          </li>
          <li class="bar-row">
            <span>Resolved</span>
            <span class="bar-track"><span class="bar resolved" id="bar-resolved"></span></span>
            <span class="bar-value" id="num-resolved">0</span>
          </li>
        </ul>
        <p class="reports-note" id="reports-note"></p>
      </section>

    </div>

    <a class="button" href="report.html">Report a problem</a>

  </main>

  <script>
    /* =====================================================
       YOUR NUMBERS: CHANGE THESE
       Everything on the page is filled in from this block.
       These are made-up sample values. Later, your team can
       replace this block with real data coming from AWS.
       ===================================================== */
    const stats = {
      cleanStreak: 12,        // days in a row the person has been active
      impactPoints: 340,
      reportsSubmitted: 9,
      reportsVerified: 7,
      reportsResolved: 5,

      // This week, Monday to Sunday. true = active that day.
      thisWeek: [true, true, true, true, true, false, false]
    };

    /* =====================================================
       You do not need to change anything below this line.
       It takes the numbers above and puts them on the page.
       ===================================================== */

    // Small helper: find an element on the page by its id
    function el(id) {
      return document.getElementById(id);
    }

    // Clean streak
    el("streak-number").textContent = stats.cleanStreak;
    el("streak-label").innerHTML =
      (stats.cleanStreak === 1 ? "day" : "days") + "<br>clean streak";

    // The week: one block for each day
    const dayLetters = ["M", "T", "W", "T", "F", "S", "S"];
    let activeDays = 0;

    stats.thisWeek.forEach(function (wasActive, i) {
      if (wasActive) activeDays = activeDays + 1;

      const item = document.createElement("li");
      item.innerHTML =
        '<div class="stone' + (wasActive ? " painted" : "") + '"></div>' +
        '<span class="day">' + dayLetters[i] + "</span>";
      el("kerb").appendChild(item);
    });

    el("streak-note").textContent =
      "Active on " + activeDays + " of 7 days this week.";

    // Impact points
    el("points-number").textContent = stats.impactPoints;

    // Report numbers
    el("num-submitted").textContent = stats.reportsSubmitted;
    el("num-verified").textContent = stats.reportsVerified;
    el("num-resolved").textContent = stats.reportsResolved;

    // Bar lengths: each bar is a share of the submitted reports
    function share(count) {
      if (stats.reportsSubmitted === 0) return "0%";
      return (count / stats.reportsSubmitted) * 100 + "%";
    }

    // Waiting one moment lets the bars grow instead of just appearing
    setTimeout(function () {
      el("bar-submitted").style.width = share(stats.reportsSubmitted);
      el("bar-verified").style.width = share(stats.reportsVerified);
      el("bar-resolved").style.width = share(stats.reportsResolved);
    }, 100);

    // The sentence under the bars
    if (stats.reportsSubmitted === 0) {
      el("reports-note").textContent =
        "You have not reported anything yet. Your first report starts your streak.";
    } else {
      el("reports-note").textContent =
        stats.reportsResolved + " of your " + stats.reportsSubmitted +
        " reports have been cleaned up.";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CHANGE THIS: the text shown on the browser tab -->
  <title>rippple</title>

  <!-- Fonts (loaded from Google Fonts, needs internet) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ---------- COLOURS ----------
       Change a colour here and it changes everywhere on the page.
       impact.html uses the same list, so keep the two in sync. */
    :root {
      --green: #157347;       /* main green: left side and main button */
      --green-deep: #0E5132;  /* darker green, used when you hover */
      --green-soft: #E8F5EE;  /* very pale green */
      --white: #FFFFFF;
      --ink: #12251B;         /* main text (a very dark green) */
      --muted: #4B5F54;       /* quieter text */
      --line: #C9E0D3;        /* borders */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--white);
      color: var(--ink);
      font-family: "Mukta", system-ui, sans-serif;
      font-size: 1.125rem;
      line-height: 1.5;
    }

    /* ---------- PAGE LAYOUT ----------
       On a phone: the green part sits on top, the buttons below it.
       On a laptop: they sit side by side and fill the whole screen
       (see the "WIDE SCREENS" block further down). */
    .split {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    .hero {
      padding: 2.5rem 1.25rem;
      background: var(--green);
      color: var(--white);
    }

    .panel {
      padding: 1.75rem 1.25rem 3rem;
      background: var(--white);
    }

    /* ---------- LOGO ----------
       CHANGE THIS: the numbers in "width" make the logo bigger or smaller. */
    .logo {
      display: block;
      width: clamp(11rem, 22vw, 17rem);
      height: auto;
      border-radius: 16px;
    }

    /* ---------- TAGLINE AND EXPLANATION ---------- */
    h1 {
      margin: 2rem 0 0.75rem;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 4.6vw, 4.25rem);
      line-height: 1.08;
      letter-spacing: -0.01em;
    }

    .intro {
      max-width: 36ch;
      margin: 0;
      color: var(--green-soft);
      font-size: clamp(1.125rem, 1.5vw, 1.35rem);
    }

    /* ---------- THE THREE BUTTONS ---------- */
    .actions {
      display: grid;
      gap: 0.9rem;
      width: 100%;
    }

    .action {
      display: block;
      padding: 1rem 1.15rem;
      background: var(--white);
      color: var(--ink);
      border: 2px solid var(--line);
      border-radius: 14px;
      text-decoration: none;
    }

    .action strong {
      display: block;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1.2;
    }

    .action span {
      color: var(--muted);
      font-size: 1rem;
    }

    .action:hover {
      background: var(--green-soft);
      border-color: var(--green);
    }

    /* The main button is filled in green so it stands out */
    .action.primary {
      background: var(--green);
      border-color: var(--green);
      color: var(--white);
    }

    .action.primary span { color: var(--green-soft); }

    .action.primary:hover {
      background: var(--green-deep);
      border-color: var(--green-deep);
    }

    /* Dark green ring when someone moves through the page with the keyboard */
    .action:focus-visible {
      outline: 3px solid var(--green-deep);
      outline-offset: 3px;
    }

    /* ---------- WIDE SCREENS (laptops and desktops) ----------
       Everything inside this block only applies when the window
       is wider than about 900 pixels. */
    @media (min-width: 56rem) {
      .split {
        grid-template-columns: 1.15fr 1fr;   /* green side a little wider */
        grid-template-rows: auto;
      }

      .hero,
      .panel {
        display: flex;
        align-items: center;                 /* centre top to bottom */
        padding: 3rem clamp(2rem, 6vw, 6rem);
      }

      .hero-inner { max-width: 40rem; }

      .actions {
        max-width: 34rem;
        gap: 1.1rem;
      }

      .action { padding: 1.4rem 1.6rem; }
      .action strong { font-size: 1.6rem; }
      .action span { font-size: 1.125rem; }
    }
  </style>
</head>
